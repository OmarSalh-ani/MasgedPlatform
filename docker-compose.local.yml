# Local / VMware lab overlay — no public DNS, no Let's Encrypt.
# Serves everything on plain HTTP (port 80) using Host() names from DOMAIN.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Or save as docker-compose.override.yml (Compose loads it automatically).
#
# On your Windows host (the machine running the browser), add to
# C:\Windows\System32\drivers\etc\hosts  (run Notepad as Administrator):
#   <VM_IP>  masged.local www.masged.local admin.masged.local api.masged.local
#
# Then open: http://admin.masged.local/setup
services:
  traefik:
    command:
      - --api.dashboard=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=masged-net
      - --entrypoints.web.address=:80
    ports:
      - "80:80"

  admin-api:
    environment:
      PublicSite__BaseUrl: "http://${DOMAIN}"
      Cors__Origins__0: "http://${DOMAIN}"
      Cors__Origins__1: "http://www.${DOMAIN}"
      Cors__Origins__2: "http://admin.${DOMAIN}"
    labels:
      - traefik.http.routers.admin-api-http.rule=Host(`admin.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/Uploads`) || PathPrefix(`/FilesManager`) || PathPrefix(`/qcf-fonts`))
      - traefik.http.routers.admin-api-http.entrypoints=web
      - traefik.http.routers.admin-api-http.priority=100
      - traefik.http.routers.admin-api-http.service=admin-api

  mobile-api:
    environment:
      ApiSettings__MediaBaseUrl: "http://admin.${DOMAIN}/"
    labels:
      - traefik.http.routers.mobile-api-http.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.mobile-api-http.entrypoints=web
      - traefik.http.routers.mobile-api-http.service=mobile-api

  admin-ui:
    environment:
      APP_API_BASE_URL: "http://admin.${DOMAIN}/api"
      APP_UPLOADS_BASE_URL: "http://admin.${DOMAIN}"
      APP_PUBLIC_SITE_URL: "http://${DOMAIN}"
    labels:
      - traefik.http.routers.admin-ui-http.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.admin-ui-http.entrypoints=web
      - traefik.http.routers.admin-ui-http.priority=1
      - traefik.http.routers.admin-ui-http.service=admin-ui

  public-ui:
    environment:
      APP_API_BASE_URL: "http://admin.${DOMAIN}/api"
      APP_UPLOADS_BASE_URL: "http://admin.${DOMAIN}"
      APP_PUBLIC_SITE_URL: "http://${DOMAIN}"
    labels:
      - traefik.http.routers.public-ui-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.public-ui-http.entrypoints=web
      - traefik.http.routers.public-ui-http.service=public-ui
