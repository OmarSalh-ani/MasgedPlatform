# Overlay that builds the four app images from source instead of pulling them.
# Requires the full repo checkout.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
services:
  admin-api:
    build:
      context: .
      dockerfile: AdminAPI/Dockerfile

  mobile-api:
    build:
      context: .
      dockerfile: MasgedParentMobileAPI/Dockerfile

  admin-ui:
    build:
      context: .
      dockerfile: AdminPanelUI/Dockerfile

  public-ui:
    build:
      context: .
      dockerfile: PublicWebsiteUI/Dockerfile
